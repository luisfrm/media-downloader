name: Release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Republicar aunque el release ya exista
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect app changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'src/**'
              - 'src-tauri/**'
              - 'scripts/**'
              - 'e2e/**'
              - 'mocks/**'
              - 'index.html'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'rust-toolchain.toml'
              - '.node-version'
              - '.github/workflows/build.yml'

  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and publish flag
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "PR detectado: solo se compila y testea."
            exit 0
          fi

          if [ "$FORCE" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "force=true: se republica $TAG."
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$TAG ya existe: solo se verifica."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$TAG es nuevo: se publica al final."
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint workflows
        run: pnpm lint:yaml

  build:
    name: ${{ matrix.name }}
    needs: [version, changes]
    if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            key: windows-x64
            bundles: msi,nsis
          - os: ubuntu-22.04
            name: Linux x64
            key: linux-x64
            bundles: deb,appimage
          - os: macos-latest
            name: macOS arm64
            key: macos-arm64
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision yt-dlp and ffmpeg
        run: pnpm setup:binaries

      - name: Provision ffmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          cp "$(command -v ffmpeg)" src-tauri/binaries/ffmpeg
          chmod +x src-tauri/binaries/ffmpeg

      - name: Toolchain versions
        run: |
          node --version
          pnpm --version
          rustc --version

      - name: Build frontend
        run: pnpm build

      - name: Test TypeScript
        run: pnpm test

      - name: Install Playwright browser
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Test end-to-end
        if: runner.os == 'Linux'
        run: pnpm test:e2e

      - name: Test Rust
        run: pnpm test:rust

      - name: Build bundles
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra="--config src-tauri/tauri.signing.conf.json"
            echo "Build firmado: se generan artefactos de actualización."
          else
            echo "::warning::Sin TAURI_SIGNING_PRIVATE_KEY: build sin artefactos de actualización."
          fi
          pnpm tauri build --bundles ${{ matrix.bundles }} $extra

      - name: Normalize artifacts
        run: >-
          node scripts/collect-artifacts.mjs
          --prefix "Media-Downloader_${{ needs.version.outputs.version }}_${{ matrix.key }}"
          --in src-tauri/target/release/bundle
          --out release

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.key }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.publish == 'true' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Add install guide
        run: cp docs/INSTALL.md release/INSTALL.md

      - name: Check updater artifacts
        run: |
          set -e
          for pattern in '*-setup.exe' '*-setup.exe.sig' '*.AppImage' '*.AppImage.sig' '*.app.tar.gz' '*.app.tar.gz.sig'; do
            if ! compgen -G "release/$pattern" > /dev/null; then
              echo "::error::Falta $pattern. Un target updater no se compiló (macOS necesita el bundle app)."
              exit 1
            fi
          done

      - name: Create or resume the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$DRAFT" != "true" ]; then
              echo "::error::$TAG ya está publicado. Los releases son inmutables: subí la versión."
              exit 1
            fi
            echo "Retomando el draft $TAG"
          else
            echo "Creando el draft $TAG"
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Media Downloader $TAG" \
              --generate-notes \
              --draft
          fi

      - name: Build updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          NOTES=$(gh release view "$TAG" --json body --jq .body)
          RELEASE_NOTES="$NOTES" node scripts/latest-json.mjs \
            --dir release \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY"

      - name: Generate checksums
        run: node scripts/collect-artifacts.mjs --checksums release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false --latest

  ci:
    name: CI
    needs: [changes, version, checks, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          VERSION: ${{ needs.version.result }}
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -e
          test "$CHANGES" = "success" || { echo "Detect changes: $CHANGES"; exit 1; }
          test "$VERSION" = "success" || { echo "Resolve version: $VERSION"; exit 1; }
          test "$CHECKS" = "success" || { echo "Repo checks: $CHECKS"; exit 1; }
          case "$BUILD" in
            success|skipped) echo "Build: $BUILD" ;;
            *) echo "Build: $BUILD"; exit 1 ;;
          esac
          echo "CI OK (build=$BUILD)"
