name: Landing

on:
  push:
    branches: [master]
    # Un push a master que no toca la landing no genera ni un run: el deploy
    # solo depende de la landing, del release que la alimenta y de este workflow.
    paths:
      - 'landing/**'
      - 'docs/LANDING.md'
      - '.github/workflows/landing.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publicar en Cloudflare Workers
        type: boolean
        default: true
  workflow_run:
    workflows: [Release]
    types: [completed]

concurrency:
  # Por evento: el run de workflow_run que sigue a cada push a master no debe
  # cancelar el deploy que disparó el push de la landing.
  group: landing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read # leer los jobs del run de Release para saber si publicó

env:
  SITE_URL: ${{ vars.LANDING_URL || 'https://media-downloader-landing.luisfrm.workers.dev' }}

jobs:
  landing:
    name: Landing
    # workflow_run also fires for pull_request runs; only react to master.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect landing changes
        id: filter
        if: github.event_name != 'workflow_run' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            landing:
              - 'landing/**'
              - 'docs/LANDING.md'
              - '.github/workflows/landing.yml'

      - name: Check the release published a version
        id: release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Publish release") | .conclusion') || conclusion=""
          if [ -z "$conclusion" ]; then
            echo "::warning::No se pudo leer el run de Release; se reconstruye por las dudas."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$conclusion" = "success" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "El run de Release no publicó una versión ($conclusion): la landing queda como está."
          fi

      - name: Decide whether to build and deploy
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          LANDING: ${{ steps.filter.outputs.landing }}
          PUBLISHED: ${{ steps.release.outputs.publish }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            run="$PUBLISHED"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            run=true
          else
            run="$LANDING"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Landing run=$run (evento: $EVENT)"

      - name: Setup pnpm
        if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: landing/.node-version
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: landing
        run: pnpm install --frozen-lockfile

      - name: Check
        if: steps.gate.outputs.run == 'true'
        working-directory: landing
        run: pnpm check

      - name: Build
        if: steps.gate.outputs.run == 'true'
        working-directory: landing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm build

      - name: Deploy
        # El gate evita correr `pnpm deploy` sin haber instalado nada y evita
        # desplegar por un run de Release que no publicó una versión.
        if: >-
          steps.gate.outputs.run == 'true' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/master' &&
          env.CLOUDFLARE_API_TOKEN != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        working-directory: landing
        run: pnpm deploy

      - name: Explain skipped deploy
        if: >-
          steps.gate.outputs.run == 'true' &&
          github.event_name != 'pull_request' &&
          env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "### Deploy omitido" >> "$GITHUB_STEP_SUMMARY"
          echo "Falta el secret \`CLOUDFLARE_API_TOKEN\`. El build pasó y el sitio quedó en \`landing/dist\`." >> "$GITHUB_STEP_SUMMARY"
